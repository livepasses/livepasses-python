[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "livepasses"
version = "0.1.0"
description = "Official Python SDK for the Livepasses API - Digital wallet pass management"
readme = "README.md"
license = "MIT"
requires-python = ">=3.10"
authors = [{ name = "Livepasses", email = "sdk@livepasses.com" }]
keywords = ["livepasses", "wallet", "apple-wallet", "google-wallet", "passes", "sdk"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Typing :: Typed",
    "Topic :: Software Development :: Libraries :: Python Modules",
]
dependencies = ["httpx>=0.27.0"]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-httpx>=0.34.0",
    "mypy>=1.10",
]

[project.urls]
Homepage = "https://livepasses.com"
Documentation = "https://docs.livepasses.com"
Repository = "https://github.com/livepasses/livepasses-python"
Issues = "https://github.com/livepasses/livepasses-python/issues"

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
livepasses = ["py.typed"]

[tool.mypy]
python_version = "3.10"
strict = true
warn_return_any = true
warn_unused_configs = true

[tool.pytest.ini_options]
testpaths = ["tests"]
